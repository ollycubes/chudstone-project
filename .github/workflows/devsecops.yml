name: DevSecOps

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.14"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies (build)
        run: pip install -r requirements-dev.txt
      - name: Check the app imports
        run: PYTHONPATH=src python -c "import api.main"

  test:
    name: Unit tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run unit and API tests
        run: |
          mkdir -p reports
          set -o pipefail
          pytest tests/unit tests/api -v --junitxml=reports/pytest.xml | tee reports/pytest.txt
      - name: Add results to the run summary
        if: always()
        run: |
          echo "## Unit test results" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 1 reports/pytest.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: unit-test-results
          path: reports/

# playwright tests
  frontend:
    name: Frontend tests (Playwright)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Install the Chromium browser
        run: playwright install --with-deps chromium
      - name: Seed the database and start the app
        working-directory: src
        run: |
          python -m api.seed
          nohup uvicorn api.main:app --host 127.0.0.1 --port 8000 > ../uvicorn.log 2>&1 &
      - name: Wait for the app to be up
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/openapi.json > /dev/null && echo "App is up" && exit 0
            sleep 1
          done
          echo "App did not start" && cat uvicorn.log && exit 1
      - name: Run frontend tests
        run: |
          mkdir -p reports
          set -o pipefail
          pytest tests/frontend -v \
            --junitxml=reports/frontend.xml --screenshot=only-on-failure --output=reports/screenshots \
            | tee reports/frontend.txt
      - name: Add results to the run summary
        if: always()
        run: |
          echo "## Frontend test results" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 1 reports/frontend.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: frontend-test-results
          path: |
            reports/
            uvicorn.log

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions: 
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: python
          build-mode: none
          queries: security-extended
          config: |
            paths-ignore:
              - tests
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python"

  sca:
    name: SCA (pip-audit)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install pip-audit
        run: pip install pip-audit==2.10.1
      - name: Scan dependencies
        run: |
          mkdir -p reports
          pip-audit -r requirements.txt --desc -f markdown -o reports/pip-audit.md
      - name: Add results to the run summary
        if: always()
        run: |
          echo "## SCA results (pip-audit)" >> $GITHUB_STEP_SUMMARY
          if [ -s reports/pip-audit.md ]; then
            cat reports/pip-audit.md >> $GITHUB_STEP_SUMMARY
          else
            echo "No known vulnerabilities found" | tee reports/pip-audit.md >> $GITHUB_STEP_SUMMARY
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sca-report
          path: reports/

  # DAST: starts the real API and attacks it with OWASP ZAP using our OpenAPI spec.
  # Only the rules marked FAIL in .zap/rules.tsv block the pipeline, other alerts are just reported.
  dast:
    name: DAST (OWASP ZAP)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Seed the database and start the API
        working-directory: src
        run: |
          python -m api.seed
          nohup uvicorn api.main:app --host 127.0.0.1 --port 8000 > ../uvicorn.log 2>&1 &
      - name: Wait for the API to be up
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/openapi.json > /dev/null && echo "API is up" && exit 0
            sleep 1
          done
          echo "API did not start" && cat uvicorn.log && exit 1
      - name: ZAP API scan
        uses: zaproxy/action-api-scan@v0.10.0
        with:
          target: http://localhost:8000/openapi.json
          format: openapi
          rules_file_name: .zap/rules.tsv
          cmd_options: -I
          fail_action: true
          allow_issue_writing: false
          artifact_name: dast-report
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dast-api-log
          path: uvicorn.log