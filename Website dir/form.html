
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Add your monthly spending | Capstone</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  :root { --navy:#031a4f; --lime:#96dc64; --card:#eef2ff; --green:#6aa84f; --red:#f03438; --line:#c9d0e4; --muted:#5b6477; }
  body { font-family:"Inter",system-ui,sans-serif; background:var(--navy); min-height:100vh; display:flex; flex-direction:column; }
  .site-header { background:var(--lime); padding:.6rem 0; }
  .brand { line-height:1.1; color:#0f172a; }
  .brand b { display:block; font-size:.8rem; }
  .brand small { font-size:.55rem; }
  .pill { background:#fff; border-radius:999px; padding:.2rem .8rem; font-size:.7rem; font-weight:500; }
  main { flex:1; }
  .intro { max-width:44rem; margin:0 auto; padding:2.5rem 0 1.5rem; color:#fff; }
  .intro h1 { font-size:clamp(1.6rem,3vw,2.25rem); font-weight:700; margin:0 0 .3rem; }
  .intro p { font-size:.9rem; margin:0; color:#e6ebff; }
  .spend-card { background:var(--card); border-radius:12px; padding:1.75rem 2rem 2rem; max-width:44rem; margin:0 auto; }
  .req { color:#d6252c; }
  .form-label { font-size:.78rem; font-weight:600; margin-bottom:.35rem; }
  .form-select,.form-control,.input-group-text { font-size:.85rem; border-color:var(--line); }
  .form-select:focus,.form-control:focus { border-color:var(--green); box-shadow:0 0 0 .2rem rgba(106,168,79,.25); }
  #month-btn { cursor:pointer; background-color:#fff; }
  .month-menu { min-width:16rem; border:1px solid var(--line); border-radius:8px; box-shadow:0 8px 24px rgba(3,26,79,.15); }
  .mp-nav { border:0; background:none; width:2rem; height:2rem; border-radius:50%; font-size:1.2rem; line-height:1; }
  .mp-nav:hover:not(:disabled) { background:var(--card); }
  .mp-nav:disabled { opacity:.3; cursor:not-allowed; }
  .mp-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:.35rem; }
  .mp-m { border:0; background:none; border-radius:4px; padding:.5rem 0; font-size:.85rem; }
  .mp-m:hover:not(:disabled) { background:var(--card); }
  .mp-m.sel { background:var(--green); color:#fff; font-weight:600; }
  .mp-m:disabled { opacity:.35; cursor:not-allowed; }
  .cats { display:grid; grid-template-columns:repeat(3,1fr); gap:.75rem; }
  .cat { background:#fff; border:1px solid var(--line); border-radius:4px; text-align:left; font-size:.85rem; padding:.55rem .75rem; }
  .cat.active { border:2px solid var(--green); font-weight:600; }
  .cat:disabled { opacity:.45; cursor:not-allowed; }
  .cat:focus-visible { outline:3px solid var(--navy); outline-offset:2px; }
  .rows { margin:1.1rem 0 0 1rem; }
  .exp { border-left:2px solid var(--line); padding-left:1.25rem; margin-bottom:2rem; }
  .exp:last-child { margin-bottom:1.1rem; }
  .del { border:0; background:none; padding:0; margin-bottom:.35rem; color:#0f172a; }
  .del:hover { color:var(--red); }
  .add { display:flex; align-items:center; gap:.35rem; margin:0 auto; background:none; border:0; font-size:.75rem; text-decoration:underline; }
  .rm-cat { background:none; border:0; padding:0; margin-bottom:.35rem; font-size:.75rem; color:#b3261e; text-decoration:underline; }
  .rm-cat:hover { color:#7f1a15; }
  .section + .section { margin-top:1.75rem; }
  .actions { display:flex; justify-content:space-between; margin-top:1.75rem; }
  .btn-next,.btn-confirm { color:#fff; font-size:.8rem; font-weight:600; border:0; border-radius:4px; padding:.6rem 1.25rem; }
  .btn-next { background:var(--green); } .btn-next:hover { background:#548a3d; color:#fff; }
  .btn-confirm { background:var(--red); } .btn-confirm:hover { background:#d02428; color:#fff; }
  footer { max-width:44rem; width:100%; margin:0 auto; padding:2rem 0 1.5rem; color:#b7c2e6; font-size:.65rem; }
  .was-validated .form-select:invalid,.was-validated .form-control:invalid { border-color:#d6252c; }
  @media (max-width:575.98px){ .spend-card{padding:1.25rem 1rem 1.5rem} .cats{grid-template-columns:1fr} .rows{margin-left:.25rem} .exp{padding-left:.85rem} }
</style>
</head>
<body>
<header class="site-header">
  <div class="container-xl d-flex justify-content-between align-items-center">
    <div class="brand"><b>CAPSTONE</b><small>Your money. More impact.</small></div>
    <span class="pill">Example: Single Professional</span>
  </div>
</header>

<main class="container-xl">
  <div class="intro">
    <h1>Add your monthly spending</h1>
    <p>Choose a month, tell us what you spent on, then add the amount.</p>
  </div>

  <form id="form" class="spend-card" novalidate action="/submit" method="POST">
    <div id="msg" class="alert d-none" role="alert"></div>
    <h2 class="h6 fw-semibold mb-0">Add spending</h2>
    <p class="text-secondary mb-3" style="font-size:.75rem">Required fields are marked <span class="req">*</span></p>

    <label class="form-label" for="month-btn">Spending month <span class="req">*</span></label>
    <div class="dropdown mb-4">
      <input type="hidden" id="month" name="month">
      <button type="button" id="month-btn" class="form-select text-start"
              data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-expanded="false"></button>
      <div class="dropdown-menu month-menu p-2">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <button type="button" class="mp-nav" id="mp-prev" aria-label="Previous year">&#8249;</button>
          <span id="mp-year" class="fw-semibold"></span>
          <button type="button" class="mp-nav" id="mp-next" aria-label="Next year">&#8250;</button>
        </div>
        <div class="mp-grid" id="mp-grid"></div>
      </div>
    </div>

    <div id="sections"></div>

    <div class="actions">
      <button type="button" id="next" class="btn btn-next">Next category</button>
      <button type="submit" class="btn btn-confirm">Confirm spending</button>
    </div>
  </form>
</main>

<footer>Sprint 1 - Monthly spending entry <span class="mx-2">/</span> Example data based on the Single Professional persona</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
const TYPES = {
  Travel:    ["Trains","Bus","Self-owned car","Car share","Taxi","Plane","Other"],
  Food:      ["Grocery","Food delivery","Restaurant","Other"],
  Utilities: ["Electricity","Gas","Water","Other"]
};
const CATS = Object.keys(TYPES);
const sections = document.getElementById("sections");
const nextBtn = document.getElementById("next");
const msg = document.getElementById("msg");

const monthInput = document.getElementById("month");
const monthBtn = document.getElementById("month-btn");
const mpYear = document.getElementById("mp-year");
const mpGrid = document.getElementById("mp-grid");
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const now = new Date();
const maxY = now.getFullYear(), maxM = now.getMonth();   // no future months
let viewYear = maxY;

function setMonth(y, m) {
  monthInput.value = `${y}-${String(m + 1).padStart(2, "0")}`;
  monthBtn.textContent = new Date(y, m).toLocaleDateString("en-GB", { month: "long", year: "numeric" });
}

function renderMonths() {
  mpYear.textContent = viewYear;
  document.getElementById("mp-next").disabled = viewYear >= maxY;
  const [selY, selM] = monthInput.value.split("-").map(Number);
  mpGrid.innerHTML = MONTHS.map((n, i) => {
    const future = viewYear === maxY && i > maxM;
    const sel = viewYear === selY && i === selM - 1;
    return `<button type="button" class="mp-m${sel ? " sel" : ""}" data-m="${i}"${future ? " disabled" : ""}>${n}</button>`;
  }).join("");
}

document.getElementById("mp-prev").onclick = () => { viewYear--; renderMonths(); };
document.getElementById("mp-next").onclick = () => { viewYear++; renderMonths(); };
mpGrid.addEventListener("click", e => {
  const b = e.target.closest(".mp-m");
  if (!b) return;
  setMonth(viewYear, +b.dataset.m);
  bootstrap.Dropdown.getOrCreateInstance(monthBtn).hide();
  renderMonths();
});

setMonth(maxY, maxM);   // default to the current month
renderMonths();


const rowHTML = (cat) => `
  <div class="exp">
    <input type="hidden" name="category" value="${cat}">
    <div class="row gx-3 gy-2">
      <div class="col-12 col-md-6">
        <label class="form-label">${cat} type <span class="req">*</span></label>
        <select name="expense_type" class="form-select" required>
          <option value="" selected disabled>Select one...</option>
          ${TYPES[cat].map(t => `<option>${t}</option>`).join("")}
        </select>
      </div>
      <div class="col-12 col-md-6">
        <div class="d-flex justify-content-between align-items-center">
          <label class="form-label">Amount spent <span class="req">*</span></label>
          <button type="button" class="del" aria-label="Delete this expense">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M5.5 5.5A.5.5 0 0 1 6 6v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5m2.5 0a.5.5 0 0 1 .5.5v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5m3 .5a.5.5 0 0 0-1 0v6a.5.5 0 0 0 1 0z"/><path d="M14.5 3a1 1 0 0 1-1 1H13v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4h-.5a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1H6a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1h3.5a1 1 0 0 1 1 1zM4.118 4 4 4.059V13a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V4.059L11.882 4zM2.5 3h11V2h-11z"/></svg>
          </button>
        </div>
        <div class="input-group">
          <span class="input-group-text">£</span>
          <input type="number" name="amount" class="form-control" placeholder="0.00" step="0.01" min="0" required>
        </div>
      </div>
      <div class="col-12">
        <label class="form-label">Note (optional)</label>
        <input type="text" name="note" class="form-control" placeholder="Add note" maxlength="200">
      </div>
    </div>
  </div>`;

const usedCats = () => [...sections.querySelectorAll(".section")].map(s => s.dataset.cat);

function addSection(cat) {
  const s = document.createElement("div");
  s.className = "section";
  s.innerHTML = `
    <div class="d-flex justify-content-between align-items-center">
      <span class="form-label">Pick a category <span class="req">*</span></span>
      <button type="button" class="rm-cat">Remove category</button>
    </div>
    <div class="cats">${CATS.map(c => `<button type="button" class="cat" data-cat="${c}">${c}</button>`).join("")}</div>
    <div class="rows"></div>
    <button type="button" class="add mt-2"></button>`;
  sections.appendChild(s);
  setCategory(s, cat);
}

function setCategory(s, cat) {
  s.dataset.cat = cat;
  s.querySelector(".rows").innerHTML = rowHTML(cat);
  s.querySelector(".add").innerHTML = `Add another ${cat.toLowerCase()} expense
    <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14m0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16"/><path d="M8 4a.5.5 0 0 1 .5.5v3h3a.5.5 0 0 1 0 1h-3v3a.5.5 0 0 1-1 0v-3h-3a.5.5 0 0 1 0-1h3v-3A.5.5 0 0 1 8 4"/></svg>`;
  refresh();
}

function refresh() {
  const used = usedCats();
  sections.querySelectorAll(".section").forEach(s => {
    s.querySelectorAll(".cat").forEach(b => {
      const on = b.dataset.cat === s.dataset.cat;
      b.classList.toggle("active", on);
      b.setAttribute("aria-pressed", on);
      b.disabled = !on && used.includes(b.dataset.cat);   // a category can only be used once
    });
  });
  nextBtn.classList.toggle("invisible", used.length >= CATS.length);
  // Only offer removal when there is more than one category on the page
  sections.querySelectorAll(".rm-cat").forEach(b => b.classList.toggle("d-none", used.length < 2));
}

sections.addEventListener("click", e => {
  const s = e.target.closest(".section");
  if (!s) return;
  if (e.target.closest(".rm-cat")) {
    const filled = [...s.querySelectorAll("select,input:not([type=hidden])")].some(x => x.value);
    if (!filled || confirm(`Remove the ${s.dataset.cat} category and its expenses?`)) { s.remove(); refresh(); }
    return;
  }
  const cat = e.target.closest(".cat");
  if (cat && cat.dataset.cat !== s.dataset.cat) setCategory(s, cat.dataset.cat);
  if (e.target.closest(".add")) s.querySelector(".rows").insertAdjacentHTML("beforeend", rowHTML(s.dataset.cat));
  const del = e.target.closest(".del");
  if (del) {
    del.closest(".exp").remove();
    if (!s.querySelector(".exp")) s.querySelector(".rows").innerHTML = rowHTML(s.dataset.cat);
  }
});

nextBtn.addEventListener("click", () => {
  const free = CATS.find(c => !usedCats().includes(c));
  if (free) { addSection(free); sections.lastElementChild.scrollIntoView({behavior:"smooth", block:"center"}); }
});

document.getElementById("form").addEventListener("submit", e => {
  e.preventDefault();                       // demo only: swap for a real POST to /spending/add
  const form = e.target, rows = [...form.querySelectorAll(".exp")];
  const blank = r => [...r.querySelectorAll("select,input:not([type=hidden])")].every(x => !x.value);
  const skipped = rows.filter(blank);
  skipped.forEach(r => r.querySelectorAll("select,input").forEach(x => x.disabled = true));
  form.classList.add("was-validated");
  const bad = form.querySelector(":invalid");
  skipped.forEach(r => r.querySelectorAll("select,input").forEach(x => x.disabled = false));
  msg.className = "alert";
  if (skipped.length === rows.length) { msg.classList.add("alert-danger"); msg.textContent = "Add at least one expense before confirming."; return; }
  if (bad) { msg.classList.add("d-none"); bad.reportValidity(); return; }
  const total = rows.filter(r => !blank(r)).reduce((t, r) => t + (parseFloat(r.querySelector("[name=amount]").value) || 0), 0);
  const [y, m] = form.month.value.split("-");
  const monthName = new Date(y, m - 1).toLocaleDateString("en-GB", { month: "long", year: "numeric" });
  msg.textContent = `Spending confirmed for ${monthName}: £${total.toFixed(2)} across ${rows.length - skipped.length} expense(s).`;
  msg.classList.add("alert-success");
  window.scrollTo({top:0, behavior:"smooth"});
});

addSection("Travel");
</script>
</body>
</html>
