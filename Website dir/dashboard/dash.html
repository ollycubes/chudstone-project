<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your dashboard | Capstone</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/spending-form/form.css" rel="stylesheet">
<link href="/dashboard/dash.css" rel="stylesheet">
</head>
<body>
<header class="site-header">
  <div class="container-xl d-flex justify-content-between align-items-center">
    <span class="pill">Example: Single Professional</span>
  </div>
</header>

<main class="container-xl">
  <div class="intro">
    <h1>Your dashboard<span id="month-label"></span></h1>
    <p>Here is what you spent and the estimated carbon it produced.</p>
  </div>

  <div id="msg" class="alert alert-danger d-none stat-row" role="alert"></div>

  <div class="row g-3 stat-row">
    <div class="col-12 col-md-6">
      <div class="stat-card">
        <span class="stat-label">Total spending</span>
        <span class="stat-value" id="total-spend">...</span>
      </div>
    </div>

    <div class="col-12 col-md-6">
      <div class="stat-card stat-card-green">
        <span class="stat-label">Estimated carbon impact</span>
        <span class="stat-value" id="total-carbon">...</span>
      </div>
    </div>
  </div>

  <section class="spend-card">
    <h2 class="h6 fw-semibold mb-3">Your entries</h2>

    <div class="table-responsive">
      <table class="table entries-table align-middle mb-0">
        <thead>
          <tr>
            <th>Category</th>
            <th>Type</th>
            <th class="text-end">Spent</th>
            <th class="text-end">Carbon (kg CO₂e)</th>
          </tr>
        </thead>
        <tbody id="entries"></tbody>
      </table>
    </div>

    <div class="actions">
      <a href="/spending-form/form.html" class="btn btn-next">Add another month</a>
    </div>
  </section>
</main>

<footer>Sprint 2 - Dashboard</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/dashboard/dash.js"></script>
</body>
</html>
