<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Totals test example</title>
</head>
<body>
  <h1>Spend and carbon by category</h1>

  <p id="status">Loading...</p>

  <table border="1">
    <thead>
      <tr><th>Category</th><th>Spend (£)</th><th>Carbon</th></tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>

  <script>
    // step 5: ask the backend for the data
    async function load() {
      const res = await fetch("/totals");                 // GET /totals (same server, so a relative path works)
      if (!res.ok) throw new Error(`Server error (${res.status})`);
      return res.json();                                   // JSON text -> JS array
    }

    // step 6: put the data on the page
    // data looks like: [{"category": "Food", "spend": 142.5, "carbon": 38.2}, ...]
    function render(data) {
      const tbody = document.getElementById("rows");
      for (const row of data) {
        const tr = document.createElement("tr");
        for (const value of [row.category, row.spend.toFixed(2), row.carbon.toFixed(2)]) {
          const td = document.createElement("td");
          td.textContent = value;                          // textContent, not innerHTML, so data can't inject HTML
          tr.appendChild(td);
        }
        tbody.appendChild(tr);
      }
      document.getElementById("status").textContent =
        data.length ? `${data.length} categories` : "No spending saved yet.";
    }

    load()
      .then(render)
      .catch(err => { document.getElementById("status").textContent = "Could not load totals: " + err.message; });
  </script>
</body>
</html>
